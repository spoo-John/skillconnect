<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — SkillConnect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    :root {
      --bg-page: #F6F8F7;
      --bg-surface: #FFFFFF;
      --border: #DDE4E1;
      --border-strong: #C3D0CA;
      --text-primary: #16332B;
      --text-secondary: #56655F;
      --text-muted: #8B958F;
      --accent: #1B5E45;
      --accent-hover: #164B38;
      --danger: #B3261E;
      --danger-bg: #FCEDEC;
      --danger-border: #F3CAC7;
      --success: #1B5E45;
      --success-bg: #E7F0EB;
      --success-border: #BFDACD;
      --radius-sm: 8px;
      --radius-lg: 18px;
      --shadow-card: 0 1px 2px rgba(22,51,43,0.04), 0 4px 16px rgba(22,51,43,0.04);
    }

    html {
      min-height: 100vh;
      background: var(--bg-page);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .glass {
      background: var(--bg-surface);
      border-radius: var(--radius-lg);
      padding: 44px 46px;
      box-shadow: var(--shadow-card);
      border: 1px solid var(--border);
      text-align: center;
      width: 360px;
      animation: fadeInUp 0.4s ease both;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    h1 {
      color: var(--text-primary);
      font-size: 32px;
      margin-bottom: 26px;
      margin-top: 0;
      font-weight: 700;
      letter-spacing: -0.6px;
    }

    label {
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 600;
      display: block;
      margin: 14px 0 6px;
      text-align: left;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      font-size: 14px;
      color: var(--text-primary);
      background: var(--bg-surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    input::placeholder {
      color: var(--text-muted);
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px #E7F0EB;
    }

    button {
      margin-top: 22px;
      padding: 13px 32px;
      font-size: 15px;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.2s ease;
      width: 100%;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
    }

    button:hover {
      background: var(--accent-hover);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .divider {
      margin: 20px 0 0;
      color: var(--text-secondary);
      font-size: 13px;
    }

    .divider a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }
    .divider a:hover { opacity: 0.8; }

    .field-wrap {
      text-align: left;
    }

    .msg {
      margin-top: 14px;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      display: none;
      text-align: left;
      font-weight: 500;
    }

    .msg.error {
      background: var(--danger-bg);
      border: 1px solid var(--danger-border);
      color: var(--danger);
      display: block;
    }

    .msg.success {
      background: var(--success-bg);
      border: 1px solid var(--success-border);
      color: var(--success);
      display: block;
    }
  </style>

  <!-- MOBILE RESPONSIVE STYLES -->
  <style>
    @media (max-width: 600px) {
      .glass { width: 90vw; padding: 32px 24px !important; }
      input { font-size: 16px !important; }
    }
  </style>

</head>
<body>
  <div class="glass">
    <h1>Sign in</h1>

    <div class="field-wrap">
      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        placeholder="you@example.com"
        autocomplete="email"
        required
      />
    </div>

    <div class="field-wrap">
      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="••••••••"
        autocomplete="current-password"
        required
      />
    </div>

    <button id="loginBtn" onclick="handleLogin()">Log in</button>

    <div id="msg" class="msg"></div>

    <p class="divider">Don't have an account? <a href="register.html">Register</a></p>
  </div>

  <script>
    const API = 'https://skillconnect-backend-production.up.railway.app/api'

    async function handleLogin() {
      const email = document.getElementById('email').value.trim()
      const password = document.getElementById('password').value.trim()
      const btn = document.getElementById('loginBtn')
      const msg = document.getElementById('msg')

      msg.className = 'msg'
      msg.textContent = ''

      if (!email || !password) {
        showMsg('Please fill in all fields.', 'error')
        return
      }

      btn.disabled = true
      btn.textContent = 'Signing in...'

      try {
        const res = await fetch(`${API}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        })

        const data = await res.json()

        if (!res.ok) {
          showMsg(data.error || 'Login failed.', 'error')
          return
        }

        localStorage.setItem('token', data.token)
        localStorage.setItem('user', JSON.stringify(data.user))

        showMsg('Login successful. Redirecting...', 'success')

        setTimeout(() => {
          if (data.user.role === 'professional') {
            window.location.href = 'profile.html'
          } else {
            window.location.href = 'dashboard.html'
          }
        }, 1000)

      } catch (err) {
        showMsg('Cannot connect to server. Make sure backend is running.', 'error')
      } finally {
        btn.disabled = false
        btn.textContent = 'Log in'
      }
    }

    function showMsg(text, type) {
      const msg = document.getElementById('msg')
      msg.textContent = text
      msg.className = `msg ${type}`
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleLogin()
    })
  </script>

</body>
</html>
