<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Messages — SkillConnect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-page: #F6F8F7;
      --bg-surface: #FFFFFF;
      --bg-surface-2: #FBFCFB;
      --bg-accent-soft: #E7F0EB;
      --bg-accent-soft-strong: #D9E9E1;
      --border: #DDE4E1;
      --border-strong: #C3D0CA;
      --text-primary: #16332B;
      --text-secondary: #56655F;
      --text-muted: #8B958F;
      --accent: #1B5E45;
      --accent-hover: #164B38;
      --danger: #B3261E;
      --online: #1B5E45;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 18px;
      --shadow-card: 0 1px 2px rgba(22,51,43,0.04), 0 4px 16px rgba(22,51,43,0.04);
    }

    html, body {
      height: 100vh; overflow: hidden;
      background: var(--bg-page);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text-primary);
    }

    /* NAV */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; gap: 24px;
      padding: 0 32px; height: 64px;
      background: rgba(255,255,255,0.94);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
    }
    .nav-logo { font-size: 19px; font-weight: 700; color: var(--text-primary); text-decoration: none; margin-right: auto; letter-spacing: -0.2px; }
    .nav-logo span { color: var(--accent); }
    nav a { color: var(--text-secondary); text-decoration: none; font-size: 14px; font-weight: 500; transition: color 0.2s; }
    nav a:hover { color: var(--text-primary); }
    .nav-avatar {
      width: 34px; height: 34px; border-radius: 50%;
      background: var(--accent);
      display: flex; align-items: center; justify-content: center;
      font-weight: 600; font-size: 12px; cursor: pointer; color: #fff;
    }
    .nav-btn { padding: 8px 18px; border-radius: var(--radius-sm); font-weight: 600; font-size: 13px; text-decoration: none; transition: all 0.2s; border: 1px solid var(--border-strong); color: var(--text-primary); }
    .nav-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* LAYOUT */
    .messages-layout {
      display: flex;
      height: calc(100vh - 64px);
      margin-top: 64px;
      position: relative; z-index: 1;
    }

    /* CONVERSATIONS SIDEBAR */
    .conv-sidebar {
      width: 300px; flex-shrink: 0;
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      background: var(--bg-surface);
    }
    .conv-header {
      padding: 20px 16px 14px;
      border-bottom: 1px solid var(--border);
    }
    .conv-header h3 { font-size: 17px; font-weight: 700; margin-bottom: 12px; }
    .conv-search {
      display: flex; align-items: center; gap: 8px;
      padding: 9px 14px;
      background: var(--bg-surface-2);
      border: 1px solid var(--border-strong);
      border-radius: 50px; transition: border-color 0.2s;
    }
    .conv-search:focus-within { border-color: var(--accent); }
    .conv-search input { flex: 1; border: none; background: transparent; color: var(--text-primary); font-size: 13px; outline: none; }
    .conv-search input::placeholder { color: var(--text-muted); }

    .conv-list { flex: 1; overflow-y: auto; }
    .conv-item {
      display: flex; gap: 12px; align-items: center;
      padding: 13px 16px;
      cursor: pointer; transition: background 0.2s;
      border-bottom: 1px solid var(--border);
    }
    .conv-item:hover { background: var(--bg-surface-2); }
    .conv-item.active { background: var(--bg-accent-soft); border-right: 2px solid var(--accent); }
    .conv-av-wrap { position: relative; flex-shrink: 0; }
    .conv-av { width: 42px; height: 42px; font-size: 14px; border-radius: 11px; display: flex; align-items: center; justify-content: center; font-weight: 700; color: white; }
    .conv-online { width: 10px; height: 10px; border-radius: 50%; background: var(--online); border: 2px solid var(--bg-surface); position: absolute; bottom: -1px; right: -1px; }
    .conv-info { flex: 1; min-width: 0; }
    .conv-name { font-weight: 700; font-size: 13px; margin-bottom: 3px; }
    .conv-preview { font-size: 12px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .conv-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; flex-shrink: 0; }
    .conv-time { font-size: 11px; color: var(--text-muted); }

    .conv-empty { padding: 40px 20px; text-align: center; color: var(--text-muted); font-size: 13px; }

    /* CHAT WINDOW */
    .chat-window { flex: 1; display: flex; flex-direction: column; background: var(--bg-page); }

    /* CHAT HEADER */
    .chat-header {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-surface);
    }
    .chat-header-av { width: 40px; height: 40px; font-size: 14px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 700; color: white; }
    .chat-header-info { flex: 1; }
    .chat-header-name { font-weight: 700; font-size: 15px; }
    .chat-header-status { font-size: 12px; color: var(--online); margin-top: 1px; }
    .chat-header-actions { display: flex; gap: 8px; }
    .icon-btn {
      width: 34px; height: 34px;
      background: var(--bg-surface-2);
      border: 1px solid var(--border-strong);
      border-radius: 9px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.2s; font-size: 13px; text-decoration: none; color: var(--text-primary);
    }
    .icon-btn:hover { background: var(--bg-accent-soft); border-color: var(--accent); }

    /* MESSAGES AREA */
    .messages-area {
      flex: 1; overflow-y: auto;
      padding: 20px 24px;
      display: flex; flex-direction: column; gap: 14px;
    }

    .day-divider { text-align: center; font-size: 11px; color: var(--text-muted); display: flex; align-items: center; gap: 12px; }
    .day-divider::before, .day-divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    .msg-group { display: flex; flex-direction: column; gap: 4px; }
    .msg-row { display: flex; gap: 8px; align-items: flex-end; }
    .msg-row.sent { flex-direction: row-reverse; }
    .msg-bubble {
      max-width: 440px; padding: 11px 15px;
      border-radius: 16px; font-size: 14px; line-height: 1.6;
    }
    .msg-row.received .msg-bubble {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px; color: var(--text-primary);
    }
    .msg-row.sent .msg-bubble {
      background: var(--accent); color: #fff;
      border-bottom-right-radius: 4px; font-weight: 500;
    }
    .msg-time { font-size: 11px; color: var(--text-muted); padding: 0 4px 2px; white-space: nowrap; }
    .msg-av-sm { width: 28px; height: 28px; font-size: 10px; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-weight: 700; color: white; flex-shrink: 0; }

    .typing-indicator { display: flex; align-items: center; gap: 8px; }
    .typing-dots { display: flex; gap: 4px; background: var(--bg-surface); border: 1px solid var(--border); padding: 10px 14px; border-radius: 16px; border-bottom-left-radius: 4px; }
    .typing-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted); animation: typingBounce 1.2s infinite; }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typingBounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-5px)} }

    /* INPUT */
    .chat-input-area {
      padding: 14px 24px;
      border-top: 1px solid var(--border);
      background: var(--bg-surface);
    }
    .input-row { display: flex; gap: 10px; align-items: flex-end; }
    .chat-input-wrap {
      flex: 1; background: var(--bg-surface-2);
      border: 1px solid var(--border-strong);
      border-radius: 14px; padding: 11px 16px;
      transition: border-color 0.2s;
    }
    .chat-input-wrap:focus-within { border-color: var(--accent); }
    .chat-textarea {
      width: 100%; background: transparent; border: none;
      color: var(--text-primary); font-family: 'Inter', sans-serif; font-size: 14px;
      outline: none; resize: none; max-height: 120px; line-height: 1.5;
    }
    .chat-textarea::placeholder { color: var(--text-muted); }
    .send-btn {
      width: 44px; height: 44px; background: var(--accent);
      border: none; border-radius: 12px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s; font-size: 16px; flex-shrink: 0; color: #fff;
    }
    .send-btn:hover { background: var(--accent-hover); }
    .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* EMPTY STATE */
    .empty-chat {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      color: var(--text-muted); text-align: center; padding: 40px;
    }
    .empty-title { font-weight: 700; font-size: 19px; color: var(--text-primary); margin-bottom: 8px; }
    .empty-sub { font-size: 14px; line-height: 1.6; color: var(--text-secondary); }

    .loading-msg { text-align: center; padding: 20px; color: var(--text-muted); font-size: 13px; }

    .msg-status { font-size: 10px; color: var(--text-muted); text-align: right; margin-top: 2px; }
  </style>

  <!-- MOBILE RESPONSIVE STYLES -->
  <style>
    @media (max-width: 768px) {
      body.messages-page { overflow: auto !important; }
      .messages-layout { flex-direction: column !important; }
      .conv-sidebar { width: 100% !important; height: 220px !important; border-right: none !important; border-bottom: 1px solid var(--border) !important; flex-shrink: 0 !important; }
      .chat-window { height: calc(100vh - 284px) !important; min-height: 380px !important; }
      .msg-bubble { max-width: 85% !important; }
      nav { padding: 0 16px !important; height: 56px !important; gap: 12px !important; }
      nav a:not(.nav-logo):not(.nav-btn):not(.nav-avatar) { display: none !important; }
    }
    .hamburger { display: none; }
  </style>

</head>
<body class="messages-page">

  <nav>
    <a href="index.html" class="nav-logo">Skill<span>Connect</span></a>
    <a href="browse.html">Browse Pros</a>
    <a href="post-need.html">Post a Need</a>
    <a href="dashboard.html" class="nav-btn">Dashboard</a>
    <div class="nav-avatar" id="navAvatar">?</div>
  </nav>

  <div class="messages-layout">

    <!-- CONVERSATIONS LIST -->
    <div class="conv-sidebar">
      <div class="conv-header">
        <h3>Messages</h3>
        <div class="conv-search">
          <input type="text" placeholder="Search conversations..." id="searchConv" oninput="searchConversations()"/>
        </div>
      </div>
      <div class="conv-list" id="convList">
        <div class="conv-empty">Loading conversations...</div>
      </div>
    </div>

    <!-- CHAT WINDOW -->
    <div class="chat-window" id="chatWindow">
      <div class="empty-chat">
        <div class="empty-title">Your messages</div>
        <div class="empty-sub">Select a conversation to start chatting,<br>or message a professional from their profile.</div>
      </div>
    </div>

  </div>

  <script>
    const API = 'https://skillconnect-backend-production.up.railway.app/api'
    let currentUser = null
    let currentConvId = null
    let currentReceiverId = null
    let conversations = []
    let pollInterval = null

    const COLORS = ['#1B5E45', '#2F6F91', '#8B5E34', '#6B5B95', '#4A7856']

    window.addEventListener('DOMContentLoaded', async () => {
      const token = localStorage.getItem('token')
      const user = JSON.parse(localStorage.getItem('user') || 'null')

      if (!token || !user) { window.location.href = 'login.html'; return }

      currentUser = user
      const initials = user.name.split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2)
      document.getElementById('navAvatar').textContent = initials

      await loadConversations()

      const params = new URLSearchParams(window.location.search)
      const toId = params.get('to')
      if (toId) {
        const conv = conversations.find(c => String(c.userId) === String(toId))
        if (conv) openChat(conv)
      }
    })

    async function loadConversations() {
      try {
        const res = await fetch(`${API}/users`)
        const pros = await res.json()
        if (!Array.isArray(pros) || !pros.length) {
          document.getElementById('convList').innerHTML = `<div class="conv-empty">No professionals to message yet.<br><a href="browse.html" style="color:var(--accent)">Browse professionals →</a></div>`
          return
        }

        conversations = pros
          .filter(p => p.id !== currentUser.id)
          .map((p, i) => {
            let skills = []
            try { skills = Array.isArray(p.skills) ? p.skills : JSON.parse(p.skills || '[]') } catch {}
            return {
              userId: p.id,
              name: p.name,
              role: skills[0] || 'Professional',
              initials: p.name.split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2),
              color: COLORS[i % COLORS.length],
              convId: `conv_${Math.min(currentUser.id, p.id)}_${Math.max(currentUser.id, p.id)}`
            }
          })

        renderConvList(conversations)
      } catch {
        document.getElementById('convList').innerHTML = `<div class="conv-empty">Failed to load conversations.</div>`
      }
    }

    function renderConvList(convs) {
      if (!convs.length) {
        document.getElementById('convList').innerHTML = `<div class="conv-empty">No conversations yet.</div>`
        return
      }
      document.getElementById('convList').innerHTML = convs.map(c => `
        <div class="conv-item ${currentConvId === c.convId ? 'active' : ''}" onclick="openChatById('${c.convId}', ${c.userId})">
          <div class="conv-av-wrap">
            <div class="conv-av" style="background:${c.color}">${c.initials}</div>
            <span class="conv-online"></span>
          </div>
          <div class="conv-info">
            <div class="conv-name">${c.name}</div>
            <div class="conv-preview">${c.role}</div>
          </div>
          <div class="conv-meta">
            <span class="conv-time">—</span>
          </div>
        </div>
      `).join('')
    }

    function searchConversations() {
      const q = document.getElementById('searchConv').value.toLowerCase()
      const filtered = conversations.filter(c => c.name.toLowerCase().includes(q) || c.role.toLowerCase().includes(q))
      renderConvList(filtered)
    }

    function openChatById(convId, userId) {
      const conv = conversations.find(c => c.convId === convId && c.userId === userId)
      if (conv) openChat(conv)
    }

    function openChat(conv) {
      if (pollInterval) clearInterval(pollInterval)

      currentConvId = conv.convId
      currentReceiverId = conv.userId

      document.querySelectorAll('.conv-item').forEach(el => el.classList.remove('active'))
      const items = document.querySelectorAll('.conv-item')
      items.forEach(el => {
        if (el.querySelector('.conv-name')?.textContent === conv.name) el.classList.add('active')
      })

      document.getElementById('chatWindow').innerHTML = `
        <div class="chat-header">
          <div class="chat-header-av" style="background:${conv.color}">${conv.initials}</div>
          <div class="chat-header-info">
            <div class="chat-header-name">${conv.name}</div>
            <div class="chat-header-status">Online</div>
          </div>
          <div class="chat-header-actions">
            <a href="profile.html?id=${conv.userId}" class="icon-btn" title="View profile">↗</a>
          </div>
        </div>

        <div class="messages-area" id="messagesArea">
          <div class="loading-msg">Loading messages...</div>
        </div>

        <div class="chat-input-area">
          <div class="input-row">
            <div class="chat-input-wrap">
              <textarea class="chat-textarea" id="msgInput" rows="1"
                placeholder="Type a message..."
                onkeydown="handleKey(event)"
                oninput="autoResize(this)"></textarea>
            </div>
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">→</button>
          </div>
        </div>
      `

      loadMessages(conv.convId)
      pollInterval = setInterval(() => loadMessages(conv.convId), 4000)
    }

    async function loadMessages(convId) {
      const token = localStorage.getItem('token')
      try {
        const res = await fetch(`${API}/messages/${convId}`, {
          headers: { 'Authorization': `Bearer ${token}` }
        })
        const msgs = await res.json()
        const area = document.getElementById('messagesArea')
        if (!area) return

        if (!Array.isArray(msgs) || !msgs.length) {
          area.innerHTML = `<div class="empty-chat" style="flex:none;padding:40px 0;"><div style="color:var(--text-secondary);font-size:14px;">No messages yet. Say hello!</div></div>`
          return
        }

        const conv = conversations.find(c => c.convId === convId)
        const scrolledToBottom = area.scrollHeight - area.scrollTop <= area.clientHeight + 50

        area.innerHTML = msgs.map(m => {
          const isSent = m.sender_id === currentUser.id
          const time = new Date(m.timestamp).toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit' })
          return `
            <div class="msg-group">
              <div class="msg-row ${isSent ? 'sent' : 'received'}">
                ${!isSent ? `<div class="msg-av-sm" style="background:${conv?.color || COLORS[0]}">${conv?.initials || '?'}</div>` : ''}
                <div class="msg-bubble">${escapeHtml(m.text)}</div>
              </div>
              <div class="msg-row ${isSent ? 'sent' : 'received'}">
                ${!isSent ? `<div style="width:28px;flex-shrink:0;"></div>` : ''}
                <div class="msg-time">${time}</div>
              </div>
            </div>
          `
        }).join('')

        if (scrolledToBottom) area.scrollTop = area.scrollHeight
      } catch {}
    }

    async function sendMessage() {
      const input = document.getElementById('msgInput')
      const btn = document.getElementById('sendBtn')
      const text = input?.value.trim()
      if (!text || !currentConvId || !currentReceiverId) return

      const token = localStorage.getItem('token')
      btn.disabled = true

      try {
        const res = await fetch(`${API}/messages`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
          body: JSON.stringify({
            receiver_id: currentReceiverId,
            text,
            conversation_id: currentConvId
          })
        })

        if (res.ok) {
          input.value = ''
          input.style.height = 'auto'
          await loadMessages(currentConvId)
          const area = document.getElementById('messagesArea')
          if (area) area.scrollTop = area.scrollHeight
        }
      } catch {}
      finally { btn.disabled = false }
    }

    function handleKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage() }
    }

    function autoResize(el) {
      el.style.height = 'auto'
      el.style.height = Math.min(el.scrollHeight, 120) + 'px'
    }

    function escapeHtml(text) {
      return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>')
    }
  </script>

</body>
</html>
