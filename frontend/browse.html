<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Browse Professionals — SkillConnect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-page: #F6F8F7;
      --bg-surface: #FFFFFF;
      --bg-surface-2: #FBFCFB;
      --bg-accent-soft: #E7F0EB;
      --bg-accent-soft-strong: #D9E9E1;
      --border: #DDE4E1;
      --border-strong: #C3D0CA;
      --text-primary: #16332B;
      --text-secondary: #56655F;
      --text-muted: #8B958F;
      --accent: #1B5E45;
      --accent-hover: #164B38;
      --star: #C9932B;
      --radius-sm: 8px;
      --radius-md: 12px;
      --shadow-card: 0 1px 2px rgba(22,51,43,0.04), 0 4px 16px rgba(22,51,43,0.04);
    }

    html, body {
      min-height: 100vh;
      background: var(--bg-page);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text-primary);
    }

    /* NAV */
    nav {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; gap: 24px;
      padding: 0 32px; height: 64px;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
    }
    .nav-logo { font-size: 19px; font-weight: 700; color: var(--text-primary); text-decoration: none; margin-right: auto; letter-spacing: -0.2px; }
    .nav-logo span { color: var(--accent); }
    nav a { color: var(--text-secondary); text-decoration: none; font-size: 14px; font-weight: 500; transition: color 0.2s; }
    nav a:hover { color: var(--text-primary); }
    nav a.active { color: var(--accent); }
    .nav-avatar {
      width: 34px; height: 34px; border-radius: 50%;
      background: var(--accent);
      display: flex; align-items: center; justify-content: center;
      font-weight: 600; font-size: 12px; cursor: pointer; color: #fff;
    }
    .nav-btn { padding: 8px 18px; border-radius: var(--radius-sm); font-weight: 600; font-size: 13px; text-decoration: none; transition: all 0.2s; }
    .nav-btn-outline { border: 1px solid var(--border-strong); color: var(--text-primary); }
    .nav-btn-outline:hover { border-color: var(--accent); color: var(--accent); }
    .nav-btn-filled { background: var(--accent); color: #fff; }
    .nav-btn-filled:hover { background: var(--accent-hover); }

    /* HERO */
    .browse-hero {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      padding: 44px 40px 36px;
      text-align: center;
    }
    .browse-hero h1 { font-size: clamp(26px,4vw,42px); font-weight: 700; margin-bottom: 12px; letter-spacing: -0.6px; }
    .browse-hero h1 em { font-style: normal; color: var(--accent); }
    .browse-hero p { color: var(--text-secondary); font-size: 15px; margin-bottom: 28px; }

    /* SEARCH */
    .search-bar {
      display: flex; gap: 10px; max-width: 680px; margin: 0 auto 22px;
      background: var(--bg-surface-2);
      border: 1px solid var(--border-strong);
      border-radius: 50px;
      padding: 6px 6px 6px 20px;
      transition: border-color 0.2s;
    }
    .search-bar:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--bg-accent-soft); }
    .search-bar input {
      flex: 1; border: none; background: transparent;
      font-size: 15px; color: var(--text-primary); outline: none; font-family: 'Inter', sans-serif;
    }
    .search-bar input::placeholder { color: var(--text-muted); }
    .search-bar button {
      padding: 10px 22px; background: var(--accent);
      color: #fff; border: none; border-radius: 50px;
      font-weight: 600; font-size: 14px;
      cursor: pointer; transition: all 0.2s; margin: 0; font-family: 'Inter', sans-serif;
    }
    .search-bar button:hover { background: var(--accent-hover); }

    /* FILTER CHIPS */
    .filter-chips { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .chip {
      padding: 7px 16px; border-radius: 50px;
      border: 1px solid var(--border-strong);
      background: var(--bg-surface); color: var(--text-secondary);
      font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s;
      font-family: 'Inter', sans-serif;
    }
    .chip:hover { border-color: var(--accent); color: var(--accent); }
    .chip.active { background: var(--bg-accent-soft); border-color: var(--accent); color: var(--accent); }

    /* BODY LAYOUT */
    .browse-body { display: flex; max-width: 1300px; margin: 0 auto; padding: 0 40px 80px; }

    /* SIDEBAR */
    .sidebar {
      width: 220px; flex-shrink: 0;
      padding: 30px 26px 30px 0;
      border-right: 1px solid var(--border);
    }
    .sidebar-section { margin-bottom: 26px; }
    .sidebar-title {
      font-weight: 700; font-size: 11px; text-transform: uppercase;
      letter-spacing: 1px; color: var(--text-muted); margin-bottom: 12px;
    }
    .sidebar-option {
      display: flex; align-items: center; gap: 10px;
      padding: 7px 0; cursor: pointer; color: var(--text-secondary);
      font-size: 14px; transition: color 0.2s;
    }
    .sidebar-option:hover { color: var(--text-primary); }
    .sidebar-option input[type="checkbox"],
    .sidebar-option input[type="radio"] { accent-color: var(--accent); width: 15px; height: 15px; cursor: pointer; }

    .availability-toggle { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; }
    .toggle-sw {
      width: 40px; height: 22px; border-radius: 12px;
      background: var(--border-strong); border: none;
      position: relative; cursor: pointer; transition: background 0.2s;
    }
    .toggle-sw.on { background: var(--accent); }
    .toggle-sw::after {
      content: ''; position: absolute; width: 16px; height: 16px;
      border-radius: 50%; background: white; top: 3px; left: 3px; transition: transform 0.2s;
    }
    .toggle-sw.on::after { transform: translateX(18px); }

    /* RESULTS */
    .results-area { flex: 1; padding: 30px 0 0 30px; }
    .results-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; }
    .results-count { font-size: 15px; font-weight: 700; }
    .results-count span { color: var(--text-secondary); font-weight: 400; font-size: 14px; }
    .sort-select {
      padding: 9px 14px;
      background: var(--bg-surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm); color: var(--text-primary);
      font-size: 14px; outline: none; cursor: pointer; font-family: 'Inter', sans-serif;
    }

    /* PRO CARDS */
    .pros-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px,1fr)); gap: 16px; }
    .pro-card {
      padding: 20px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      display: flex; flex-direction: column;
      transition: all 0.2s;
      box-shadow: var(--shadow-card);
    }
    .pro-card:hover { border-color: var(--accent); transform: translateY(-2px); }

    .pro-card-top { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 14px; }
    .pro-av-wrap { position: relative; display: inline-flex; }
    .pro-avatar {
      width: 48px; height: 48px; border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 16px; color: #fff;
    }
    .pro-avail {
      width: 10px; height: 10px; border-radius: 50%; background: var(--accent);
      border: 2px solid var(--bg-surface); position: absolute; bottom: 2px; right: 2px;
    }
    .pro-info { flex: 1; }
    .pro-name { font-weight: 700; font-size: 15px; margin-bottom: 3px; }
    .pro-role-title { font-size: 13px; color: var(--text-secondary); margin-bottom: 5px; }
    .pro-rating { display: flex; align-items: center; gap: 5px; font-size: 13px; color: var(--star); }
    .pro-rating .count { color: var(--text-muted); font-size: 12px; }

    .pro-bio { font-size: 13px; color: var(--text-secondary); line-height: 1.6; margin-bottom: 14px; flex: 1; }
    .pro-skills { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 16px; }
    .skill-tag { display: inline-block; padding: 3px 10px; border-radius: 50px; background: var(--bg-accent-soft); color: var(--accent); font-size: 11px; font-weight: 600; }

    .pro-card-footer {
      display: flex; justify-content: space-between; align-items: center;
      padding-top: 14px; border-top: 1px solid var(--border); margin-top: auto;
    }
    .pro-rate { font-weight: 600; font-size: 13px; }
    .pro-rate span { font-weight: 400; font-size: 12px; color: var(--text-secondary); }

    .btn-ghost {
      padding: 7px 14px;
      background: var(--bg-surface-2);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm); color: var(--text-primary);
      font-size: 12px; font-weight: 600;
      cursor: pointer; text-decoration: none; transition: all 0.2s;
    }
    .btn-ghost:hover { background: var(--bg-accent-soft); color: var(--accent); border-color: var(--accent); }

    /* EMPTY / LOADING */
    .empty { text-align: center; padding: 60px 20px; color: var(--text-muted); font-size: 15px; grid-column: 1/-1; }
    .loading { text-align: center; padding: 60px 20px; color: var(--text-muted); font-size: 14px; grid-column: 1/-1; }

    /* PAGINATION */
    .pagination { display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 36px; }
    .page-btn {
      width: 38px; height: 38px; border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
      background: var(--bg-surface); border: 1px solid var(--border-strong);
      color: var(--text-secondary); font-size: 14px; font-weight: 600;
      cursor: pointer; transition: all 0.2s; text-decoration: none;
    }
    .page-btn:hover, .page-btn.active { background: var(--bg-accent-soft); border-color: var(--accent); color: var(--accent); }

    @keyframes fadeInUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
    .fade-up { animation: fadeInUp 0.4s ease both; }
  </style>

  <!-- MOBILE RESPONSIVE STYLES -->
  <style>
    @media (max-width: 900px) {
      .browse-body { flex-direction: column !important; padding: 0 20px 60px !important; }
      .sidebar { width: 100% !important; border-right: none !important; border-bottom: 1px solid var(--border) !important; padding: 20px 0 !important; }
      .results-area { padding: 24px 0 0 0 !important; }
    }
    @media (max-width: 600px) {
      .pros-grid { grid-template-columns: 1fr !important; }
    }
  </style>

</head>
<body>

  <nav>
    <a href="index.html" class="nav-logo">Skill<span>Connect</span></a>
    <a href="browse.html" class="active">Browse Pros</a>
    <a href="post-need.html">Post a Need</a>
    <a href="messages.html">Messages</a>
    <div class="nav-avatar" id="navAvatar" style="display:none;">?</div>
    <a href="login.html" class="nav-btn nav-btn-outline" id="navLogin">Log In</a>
    <a href="register.html" class="nav-btn nav-btn-filled" id="navRegister">Get Started</a>
  </nav>

  <!-- HERO -->
  <div class="browse-hero fade-up">
    <h1>Find your <em>perfect</em> match</h1>
    <p id="heroSub">Browse verified tech professionals across multiple skill categories</p>
    <div class="search-bar">
      <input type="text" placeholder="Search by name, skill, or keyword..." id="searchInput"/>
      <button onclick="applySearch()">Search</button>
    </div>
    <div class="filter-chips">
      <button class="chip active" onclick="filterBySkill(this,'all')">All</button>
      <button class="chip" onclick="filterBySkill(this,'Frontend Dev')">Frontend Dev</button>
      <button class="chip" onclick="filterBySkill(this,'Backend Dev')">Backend Dev</button>
      <button class="chip" onclick="filterBySkill(this,'Cybersecurity')">Cybersecurity</button>
      <button class="chip" onclick="filterBySkill(this,'Mobile Dev')">Mobile Dev</button>
      <button class="chip" onclick="filterBySkill(this,'UI / UX Design')">UI / UX</button>
      <button class="chip" onclick="filterBySkill(this,'Data Analysis')">Data Analysis</button>
      <button class="chip" onclick="filterBySkill(this,'DevOps')">DevOps</button>
    </div>
  </div>

  <div class="browse-body">

    <!-- SIDEBAR -->
    <div class="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-title">Availability</div>
        <div class="availability-toggle">
          <span style="font-size:14px;color:var(--text-secondary);">Available now</span>
          <div class="toggle-sw on" onclick="this.classList.toggle('on')"></div>
        </div>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-title">Skills</div>
        <label class="sidebar-option"><input type="checkbox" onchange="applyFilters()"/> Frontend Dev</label>
        <label class="sidebar-option"><input type="checkbox" onchange="applyFilters()"/> Backend Dev</label>
        <label class="sidebar-option"><input type="checkbox" onchange="applyFilters()"/> Cybersecurity</label>
        <label class="sidebar-option"><input type="checkbox" onchange="applyFilters()"/> Mobile Dev</label>
        <label class="sidebar-option"><input type="checkbox" onchange="applyFilters()"/> UI / UX Design</label>
        <label class="sidebar-option"><input type="checkbox" onchange="applyFilters()"/> Data Analysis</label>
        <label class="sidebar-option"><input type="checkbox" onchange="applyFilters()"/> DevOps</label>
        <label class="sidebar-option"><input type="checkbox" onchange="applyFilters()"/> IT Support</label>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-title">Sort by</div>
        <label class="sidebar-option"><input type="radio" name="sort" value="newest" checked onchange="applyFilters()"/> Newest</label>
        <label class="sidebar-option"><input type="radio" name="sort" value="name" onchange="applyFilters()"/> Name A–Z</label>
      </div>
    </div>

    <!-- RESULTS -->
    <div class="results-area">
      <div class="results-header">
        <div class="results-count" id="resultsCount">Loading... <span>professionals</span></div>
        <select class="sort-select" onchange="applyFilters()">
          <option value="newest">Sort: Newest</option>
          <option value="name">Name A–Z</option>
        </select>
      </div>

      <div class="pros-grid" id="prosGrid">
        <div class="loading">Loading professionals...</div>
      </div>

      <div class="pagination" id="pagination"></div>
    </div>
  </div>

  <script>
    const API = 'https://skillconnect-backend-production.up.railway.app/api'
    let allPros = []
    let activeSkill = 'all'
    const COLORS = ['#1B5E45', '#2F6F91', '#8B5E34', '#6B5B95', '#4A7856', '#7A5230']
    const PER_PAGE = 6
    let currentPage = 1

    window.addEventListener('DOMContentLoaded', () => {
      const user = JSON.parse(localStorage.getItem('user') || 'null')
      if (user) {
        const initials = user.name.split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2)
        document.getElementById('navAvatar').textContent = initials
        document.getElementById('navAvatar').style.display = 'flex'
        document.getElementById('navLogin').style.display = 'none'
        document.getElementById('navRegister').style.display = 'none'
      }

      loadPros()

      document.getElementById('searchInput').addEventListener('keydown', e => {
        if (e.key === 'Enter') applySearch()
      })
    })

    async function loadPros() {
      try {
        const res = await fetch(`${API}/users`)
        const data = await res.json()
        allPros = Array.isArray(data) ? data : []
        document.getElementById('heroSub').textContent =
          `Browse ${allPros.length} verified tech professional${allPros.length !== 1 ? 's' : ''} on SkillConnect`
        applyFilters()
      } catch {
        document.getElementById('prosGrid').innerHTML = `<div class="empty">Failed to load professionals. Make sure the backend is running.</div>`
      }
    }

    function filterBySkill(btn, skill) {
      document.querySelectorAll('.filter-chips .chip').forEach(c => c.classList.remove('active'))
      btn.classList.add('active')
      activeSkill = skill
      currentPage = 1
      applyFilters()
    }

    function applySearch() {
      currentPage = 1
      applyFilters()
    }

    function applyFilters() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim()
      const checkedSkills = [...document.querySelectorAll('.sidebar-option input[type="checkbox"]:checked')]
        .map(el => el.parentElement.textContent.trim())
      const sortVal = document.querySelector('.sort-select').value

      let filtered = allPros.filter(p => {
        let skills = []
        try { skills = Array.isArray(p.skills) ? p.skills : JSON.parse(p.skills || '[]') } catch {}

        if (activeSkill !== 'all') {
          const hasSkill = skills.some(s => s.toLowerCase().includes(activeSkill.toLowerCase()))
          if (!hasSkill) return false
        }

        if (checkedSkills.length > 0) {
          const hasAny = checkedSkills.some(cs => skills.some(s => s.toLowerCase().includes(cs.toLowerCase())))
          if (!hasAny) return false
        }

        if (query) {
          const searchable = `${p.name} ${p.bio || ''} ${skills.join(' ')}`.toLowerCase()
          if (!searchable.includes(query)) return false
        }

        return true
      })

      if (sortVal === 'name') filtered.sort((a,b) => a.name.localeCompare(b.name))

      renderPros(filtered)
    }

    function renderPros(pros) {
      const grid = document.getElementById('prosGrid')
      const total = pros.length
      const start = (currentPage - 1) * PER_PAGE
      const paged = pros.slice(start, start + PER_PAGE)

      document.getElementById('resultsCount').innerHTML =
        `${total} <span>professional${total !== 1 ? 's' : ''} found</span>`

      if (!paged.length) {
        grid.innerHTML = `<div class="empty">No professionals found. Try a different search or filter.</div>`
        document.getElementById('pagination').innerHTML = ''
        return
      }

      grid.innerHTML = paged.map((p, i) => {
        const initials = p.name.split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2)
        let skills = []
        try { skills = Array.isArray(p.skills) ? p.skills : JSON.parse(p.skills || '[]') } catch {}
        const color = COLORS[(start + i) % COLORS.length]

        return `
          <div class="pro-card">
            <div class="pro-card-top">
              <div class="pro-av-wrap">
                <div class="pro-avatar" style="background:${color}">${initials}</div>
                <span class="pro-avail"></span>
              </div>
              <div class="pro-info">
                <div class="pro-name">${p.name}</div>
                <div class="pro-role-title">${skills[0] || 'Professional'}</div>
                <div class="pro-rating">★★★★★ <span class="count">(New)</span></div>
              </div>
            </div>
            <p class="pro-bio">${p.bio || 'Experienced professional available for hire on SkillConnect.'}</p>
            <div class="pro-skills">${skills.slice(0,4).map(s=>`<span class="skill-tag">${s}</span>`).join('')}</div>
            <div class="pro-card-footer">
              <div class="pro-rate">Available <span>for hire</span></div>
              <a href="profile.html?id=${p.id}" class="btn-ghost">View profile</a>
            </div>
          </div>
        `
      }).join('')

      renderPagination(pros)
    }

    function renderPagination(pros) {
      const totalPages = Math.ceil(pros.length / PER_PAGE)
      const pag = document.getElementById('pagination')
      if (totalPages <= 1) { pag.innerHTML = ''; return }

      let html = `<a class="page-btn" onclick="changePage(${currentPage-1}, event)">←</a>`
      for (let i = 1; i <= totalPages; i++) {
        html += `<a class="page-btn ${i===currentPage?'active':''}" onclick="changePage(${i}, event)">${i}</a>`
      }
      html += `<a class="page-btn" onclick="changePage(${currentPage+1}, event)">→</a>`
      pag.innerHTML = html
    }

    function changePage(page, e) {
      e.preventDefault()
      const totalPages = Math.ceil(allPros.length / PER_PAGE)
      if (page < 1 || page > totalPages) return
      currentPage = page
      applyFilters()
      window.scrollTo({ top: 0, behavior: 'smooth' })
    }
  </script>

</body>
</html>
